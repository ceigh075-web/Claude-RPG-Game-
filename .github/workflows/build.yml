name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish a Release when a version tag is pushed

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest -v
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
      - name: Headless playthroughs
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          python tools/autoplay.py out/autoplay
          python tools/combat_demo.py out/combat
          python tools/ui_smoke.py out/ui

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: KindredRoads-windows
            exe: KindredRoads.exe
          - os: ubuntu-latest
            artifact: KindredRoads-linux
            exe: KindredRoads
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pillow
      - name: Build executable
        run: pyinstaller --noconfirm KindredRoads.spec
      - name: Self-test the executable
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ./dist/${{ matrix.exe }} --selftest
      - name: Package
        shell: bash
        run: |
          mkdir -p package/KindredRoads
          cp dist/${{ matrix.exe }} package/KindredRoads/
          cp README.md PLAYING.md ASSETS.md package/KindredRoads/
          cd package && 7z a ../${{ matrix.artifact }}.zip KindredRoads || zip -r ../${{ matrix.artifact }}.zip KindredRoads
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    # Every push to main (and every v* tag) publishes a downloadable Release with the built zips.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Kindred Roads ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Windows:** download `KindredRoads-windows.zip` below, unzip it (right-click > Extract All),
            open the folder and double-click `KindredRoads.exe`. Nothing to install.
            If Windows SmartScreen warns you, click "More info" > "Run anyway".
            Linux: `KindredRoads-linux.zip`. Controls and tips: PLAYING.md.
